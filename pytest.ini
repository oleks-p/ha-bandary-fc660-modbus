[pytest]
testpaths = tests
# tools/ holds standalone scripts; the probe and the simulator are imported as
# top-level modules.
pythonpath = . tools
# Needed by the Home Assistant test harness (its autouse fixtures are async).
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore:Unknown config option:pytest.PytestConfigWarning
